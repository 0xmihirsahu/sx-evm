# Full reference https://github.com/foundry-rs/foundry/tree/master/config

[profile.default]
auto_detect_solc = false
bytecode_hash = "none"
fuzz = { runs = 256 }
gas_reports = ["*"]
libs = ["lib"]
optimizer = true
optimizer_runs = 10_000
out = "out"
solc = "0.8.27"
src = "src"
test = "test"
via_ir = true
ffi = true
fs_permissions = [{ access = "read-write", path = ".forge-snapshots/"}, { access = "read-write", path = "./deployments/"}]

# Compile test files as a separate unit with fewer optimizer runs. The confidential-voting
# test helpers ABI-encode nested dynamic arrays (TallyDecryption[3] with bytes[] signatures),
# which trips via-ir's stack scheduler at high optimizer_runs. Production (src) stays at 10_000.
[[profile.default.additional_compiler_profiles]]
name = "test-lite"
via_ir = true
optimizer = true
optimizer_runs = 200

[[profile.default.compilation_restrictions]]
paths = "test/**"
max_optimizer_runs = 200

[profile.ci]
fuzz = { runs = 1_000 }
verbosity = 4
